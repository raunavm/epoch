<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epoch</title>
<meta name="description" content="Epoch shows every picture NASA's SPHEREx telescope has taken of a patch of sky, in time order, so you can see what changed there.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2317171b%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2720%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;600;700&family=Public+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/timemachine.js"></script>
</head>
<body data-title="title.timemachine">
<a class="skip" href="#main" data-i18n="nav.skip">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main" tabindex="-1">
<section class="intro">
<div class="intro-text">
<h1 data-i18n="tm.h1">SPHEREx time machine</h1>
<p class="lede" data-i18n="tm.lede"></p>
<p class="intro-found"><a href="results.html#methane-candidates" data-i18n="intro.found">Found: 16 cold brown dwarfs whose methane SPHEREx measures directly, none with a published spectrum. See them →</a></p>
<p class="tour-start"><button id="tour-btn" type="button" class="btn" data-i18n="tour.btn">New here? Take the tour (1 minute)</button></p>
<h2 class="form-h" data-i18n="tm.form_h">Look at any position</h2>
<form id="coord-form" class="coord-form" aria-label="Position">
  <div class="form-row coords">
    <label><span data-i18n="live.ra">Right ascension</span> <input id="ra" inputmode="text" autocomplete="off" spellcheck="false" aria-describedby="coord-eg"></label>
    <label><span data-i18n="live.dec">Declination</span> <input id="dec" inputmode="text" autocomplete="off" spellcheck="false" aria-describedby="coord-eg"></label>
    <label class="fov-label"><span data-i18n="live.fov">Field of view</span> <select id="fov"></select></label>
    <button class="btn primary" type="submit" data-i18n="live.go">Show</button>
  </div>
  <p class="hint"><span id="coord-eg" data-i18n="live.coord_eg"></span> <span id="fov-cost"></span></p>
  <p id="form-error" class="form-error" role="alert"></p>
  <div class="presets" role="group" aria-labelledby="presets-h"><span id="presets-h" class="small" data-i18n="live.presets">Targets:</span> <span id="preset-buttons"></span></div>
  <div class="form-row" hidden><label for="target" class="small" data-i18n="live.target">More fields</label> <select id="target"></select></div>
  <p id="target-note" class="muted small"></p>
</form>
</div>
<figure id="intro-fig" class="intro-fig"></figure>
</section>
<div id="live" hidden></div>
<section id="showcase" aria-labelledby="h-showcase">
<h2 id="h-showcase" data-i18n="live.showcase_h">Prepared field</h2>
<p class="hint" data-i18n="tm.hint"></p>
<div class="field-pick"><label for="field" class="small" data-i18n="tm.field">Field</label> <select id="field"></select></div>
<div id="tm" class="panel"></div>
</section>
<section id="target-result" class="result-card" aria-labelledby="h-result" hidden></section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<noscript><p class="unavailable">This site needs JavaScript to draw the images and charts.</p></noscript>
</body>
</html>
